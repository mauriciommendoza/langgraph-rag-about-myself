command: 
  # Databricks expects the app to bind to 0.0.0.0 and defaults to port 8000
  # The -h flag runs Chainlit in headless mode so it doesn't try to open a browser window
  - "chainlit"
  - "run"
  - "app_ui.py"
  - "-h" # headless mode
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# Define the secrets your app will need. 
# You will set the actual values securely in the Databricks Apps UI during deployment.
env:
  - name: GROQ_API_KEY
  - name: PINECONE_API_KEY
  - name: PINECONE_INDEX_NAME
